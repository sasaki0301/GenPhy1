<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 6 Assessment: Oscillations and Waves</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Chapter 6 Assessment: Oscillations and Waves</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>
  const quizData = [

{
q:"Simple harmonic motion occurs when:",
c:[
"The object moves at constant speed",
"The restoring force is proportional to displacement and directed toward equilibrium",
"The object moves in a circle",
"The net force is always zero"
],
a:1,
e:"SHM requires a restoring force that is proportional to displacement and directed toward equilibrium."
},

{
q:"The maximum displacement from equilibrium is called:",
c:["Period","Frequency","Amplitude","Wavelength"],
a:2,
e:"Amplitude is the greatest displacement from equilibrium."
},

{
q:"An oscillator completes one cycle every 0.25 s. What is its frequency?",
c:["2 Hz","4 Hz","8 Hz","0.25 Hz"],
a:1,
e:"f = 1/T = 1/0.25 = 4 Hz."
},

{
q:"Where is the speed of an object in SHM greatest?",
c:[
"At maximum displacement",
"At equilibrium",
"Halfway to equilibrium",
"Speed is constant"
],
a:1,
e:"The object is fastest at equilibrium."
},

{
q:"At maximum displacement, the kinetic energy of an SHM system is:",
c:["Maximum","Minimum","Constant","Infinite"],
a:1,
e:"The object momentarily stops at maximum displacement."
},

{
q:"For a pendulum undergoing small oscillations, increasing the length will:",
c:[
"Decrease the period",
"Increase the period",
"Have no effect",
"Double the frequency"
],
a:1,
e:"Longer pendulums have longer periods."
},

{
q:"Which statement about mechanical waves is correct?",
c:[
"They can travel through a vacuum",
"They require a medium",
"They carry matter from source to observer",
"They move particles permanently"
],
a:1,
e:"Mechanical waves require a material medium."
},

{
q:"A wave transfers:",
c:[
"Matter only",
"Energy only",
"Mass only",
"Energy and permanent matter transfer"
],
a:1,
e:"Waves transfer energy without permanently transferring matter."
},

{
q:"In a transverse wave, particle motion is:",
c:[
"Parallel to wave motion",
"Perpendicular to wave motion",
"Circular",
"Random"
],
a:1,
e:"Transverse waves oscillate perpendicular to the direction of travel."
},

{
q:"Which wave is longitudinal?",
c:[
"Light wave",
"Wave on a rope",
"Sound wave",
"Radio wave"
],
a:2,
e:"Sound waves are longitudinal mechanical waves."
},

{
q:"The distance between two successive crests is:",
c:[
"Amplitude",
"Frequency",
"Wavelength",
"Period"
],
a:2,
e:"Wavelength is the distance between identical points on consecutive cycles."
},

{
q:"A wave has frequency 6 Hz and wavelength 4 m. Find its speed.",
c:[
"10 m/s",
"12 m/s",
"24 m/s",
"30 m/s"
],
a:2,
e:"v = fλ = (6)(4) = 24 m/s."
},

{
q:"A wave travels at 30 m/s and has wavelength 5 m. What is its frequency?",
c:[
"5 Hz",
"6 Hz",
"10 Hz",
"15 Hz"
],
a:1,
e:"f = v/λ = 30/5 = 6 Hz."
},

{
q:"The pitch of a sound depends primarily on:",
c:[
"Amplitude",
"Frequency",
"Wave speed",
"Wavelength only"
],
a:1,
e:"Frequency determines pitch."
},

{
q:"Louder sounds have:",
c:[
"Higher frequency",
"Greater amplitude",
"Longer wavelength",
"Lower speed"
],
a:1,
e:"Amplitude determines loudness."
},

{
q:"Which statement about sound is correct?",
c:[
"Sound can travel through vacuum",
"Sound is a transverse electromagnetic wave",
"Sound is a longitudinal mechanical wave",
"Sound travels without a medium"
],
a:2,
e:"Sound is a longitudinal mechanical wave."
},

{
q:"Resonance occurs when:",
c:[
"Frequency becomes zero",
"An object vibrates at its natural frequency",
"Two waves cancel completely",
"A wave stops moving"
],
a:1,
e:"Resonance occurs when driving frequency matches natural frequency."
},

{
q:"Standing waves contain:",
c:[
"Crests and rarefactions",
"Only compressions",
"Nodes and antinodes",
"Only troughs"
],
a:2,
e:"Standing waves contain nodes and antinodes."
},

{
q:"A node is a point where:",
c:[
"Displacement is maximum",
"Displacement is zero",
"Frequency is highest",
"Speed is maximum"
],
a:1,
e:"Nodes remain stationary."
},

{
q:"An antinode is a point where:",
c:[
"Displacement is maximum",
"Displacement is zero",
"Energy disappears",
"Frequency becomes zero"
],
a:0,
e:"Antinodes oscillate with maximum amplitude."
},

{
q:"The Doppler Effect is the apparent change in:",
c:[
"Wave speed",
"Frequency due to relative motion",
"Amplitude due to resonance",
"Energy due to reflection"
],
a:1,
e:"The Doppler Effect results from relative motion between source and observer."
},

{
q:"When a siren approaches an observer, the observed pitch becomes:",
c:[
"Lower",
"Higher",
"Unchanged",
"Zero"
],
a:1,
e:"Approaching sources produce higher observed frequency."
},

{
q:"When a sound source moves away from an observer, the observed frequency:",
c:[
"Increases",
"Remains constant",
"Decreases",
"Becomes infinite"
],
a:2,
e:"Receding sources produce lower observed frequency."
},

{
q:"Which phenomenon indicates a galaxy is moving away from Earth?",
c:[
"Blueshift",
"Resonance",
"Redshift",
"Reflection"
],
a:2,
e:"Redshift indicates motion away from the observer."
},

{
q:"Blueshift occurs when a star is:",
c:[
"Moving away",
"Stationary",
"Moving toward Earth",
"Exploding"
],
a:2,
e:"Approaching light sources produce blueshift."
},

{
q:"A wave source doubles its frequency while wave speed remains constant. The wavelength will:",
c:[
"Double",
"Remain constant",
"Become half",
"Become four times larger"
],
a:2,
e:"Since v=fλ, doubling frequency halves wavelength."
},

{
q:"A student pushes a swing at exactly the correct timing every cycle. This is an example of:",
c:[
"Interference",
"Diffraction",
"Resonance",
"Doppler Effect"
],
a:2,
e:"The swing receives energy at its natural frequency."
},

{
q:"Pisay-Style: Two pendulums have identical lengths but different masses. Which has the longer period?",
c:[
"Heavier pendulum",
"Lighter pendulum",
"Both have the same period",
"Cannot be determined"
],
a:2,
e:"For small oscillations, pendulum period does not depend on mass."
},

{
q:"Pisay-Style: A sound wave and a light wave have the same frequency. Which statement is correct?",
c:[
"Both require a medium",
"Both are mechanical waves",
"Only the sound wave requires a medium",
"Neither transfers energy"
],
a:2,
e:"Sound requires a medium while light can travel through vacuum."
},

{
q:"Pisay-Style: An ambulance passes an observer. At the instant it passes, the observer notices a sudden change in pitch. Why?",
c:[
"The siren changes frequency",
"The speed of sound changes",
"The source changes from approaching to receding",
"The observer loses hearing temporarily"
],
a:2,
e:"The observed frequency changes because the relative motion reverses."
},

{
q:"Pisay-Style: A standing wave forms on a string. Which point experiences the greatest motion?",
c:[
"Node",
"Equilibrium point",
"Antinode",
"Boundary"
],
a:2,
e:"Antinodes have maximum displacement."
},

{
q:"Pisay-Style: A wave travels from one medium into another and slows down. If frequency remains constant, the wavelength will:",
c:[
"Increase",
"Decrease",
"Remain unchanged",
"Double"
],
a:1,
e:"Since v=fλ, lower speed means shorter wavelength when frequency is constant."
},

{
q:"Pisay-Style: A spring oscillator moves from maximum displacement toward equilibrium. During this interval:",
c:[
"Potential energy increases and kinetic energy decreases",
"Potential energy decreases and kinetic energy increases",
"Both energies increase",
"Both energies decrease"
],
a:1,
e:"Potential energy converts into kinetic energy."
},

{
q:"Pisay-Style: Two waves travel through the same medium. Wave A has twice the wavelength of Wave B. If both travel at the same speed, Wave A has:",
c:[
"Twice the frequency",
"Half the frequency",
"Four times the frequency",
"The same frequency"
],
a:1,
e:"Frequency is inversely proportional to wavelength when speed is constant."
},

{
q:"Which statement best summarizes Chapter 6?",
c:[
"Oscillations, waves, sound, resonance, and Doppler shifts are all connected through periodic motion and energy transfer",
"Only sound waves exhibit periodic motion",
"Mechanical waves transfer matter permanently",
"Doppler Effect changes wave speed"
],
a:0,
e:"Chapter 6 links oscillations, wave behavior, sound, resonance, and Doppler phenomena."
}

];

  let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
